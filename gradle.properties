## Mod Properties
mod_id=dtru
mod_name=DynamicTreesRU
mod_license=All Rights Reserved
mod_version=1.2.0
mod_group_id=dtteam.dtru
mod_authors= DviousDingle, Vimhax
mod_credits= metafive, Yuneth Alwis
mod_description= A 26.1 Neoforge Port for Dynamic Trees Regions Unexplored

versionType=beta

## Dependencies
# Dynamic Trees is patched locally; build the DynamicTrees 26.1 branch with
# :neoforge:publishToMavenLocal so this resolves from mavenLocal.
dynamic_trees_version=1.8.0-BETA04.1
# Likewise for Dynamic Trees Plus: build its 26.1 branch with :neoforge:publishToMavenLocal.
dynamic_trees_plus_version=1.4.0-BETA01
# Regions Unexplored publishes the same version number for several Minecraft versions, so the
# Modrinth *version id* is used for resolution and the plain number for the dependency range.
regions_unexplored_version_id=WbhEQ9sa
regions_unexplored_version=0.7.0
# Regions Unexplored hard-requires Lithostitched; needed for the dev runs only.
lithostitched_version_id=84kuUpr4

## Minecraft Properties
minecraft_version=26.1.2
minecraft_version_range=[26.1,26.2)
neo_version=26.1.2.87
loader_version_range=[4,)

## Java Stuff
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
