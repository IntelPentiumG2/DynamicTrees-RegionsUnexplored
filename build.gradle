import me.modmuss50.mpp.ReleaseType

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'idea'
    id "me.modmuss50.mod-publish-plugin" version "1.1.0"
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        url 'https://harleyoconnor.com/maven'
    }
    // Dynamic Trees and Dynamic Trees Plus are built locally for 26.1; see gradle.properties.
    mavenLocal()
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.1, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        clientData {
            clientData()

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Non-transitive: both mods' published metadata lists the CurseForge mods they use for their
    // own dev runs, which this add-on neither needs nor has a repository for.
    implementation("com.dtteam.dynamictrees:dynamictrees-neoforge-${minecraft_version}:${dynamic_trees_version}") {
        transitive = false
    }
    implementation("com.dtteam.dynamictreesplus:dynamictreesplus-neoforge-${minecraft_version}:${dynamic_trees_plus_version}") {
        transitive = false
    }
    implementation "maven.modrinth:regions-unexplored:${regions_unexplored_version_id}"
    // Regions Unexplored routes most of its trees through Lithostitched selector features, which
    // have to be unwrapped before they can be cancelled; see LithostitchedTreeFeatureCanceller.
    compileOnly "maven.modrinth:lithostitched:${lithostitched_version_id}"
    runtimeOnly "maven.modrinth:lithostitched:${lithostitched_version_id}"
}

// Hand-written resources take precedence over generated ones; see the note in DynamicTreesRU.
tasks.withType(AbstractCopyTask).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version         : minecraft_version,
            minecraft_version_range   : minecraft_version_range,
            neo_version               : neo_version,
            loader_version_range      : loader_version_range,
            mod_id                    : mod_id,
            mod_name                  : mod_name,
            mod_license               : mod_license,
            mod_version               : mod_version,
            mod_authors               : mod_authors,
            mod_credits               : mod_credits,
            mod_description           : mod_description,
            regions_unexplored_version: regions_unexplored_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

def changelogFile = file("build/changelog.txt")

publishMods {
    file = jar.archiveFile
    displayName = "${mod_name.replace(' ','')}-NeoForge-${minecraft_version} ${project.version}"
    if (changelogFile.exists()) {
        changelog.set(changelogFile.getText())
    }
    type = ReleaseType.of(versionType.toUpperCase())
    modLoaders.add("neoforge")

    curseforge {
        projectId = "1157051"
        projectSlug = "dynamic-trees-regions-unexplored" // Required for discord webhook
        accessToken = project.findProperty("curseApiKey") ?: System.getenv("CURSEFORGE_API_KEY")
        minecraftVersions.add(minecraft_version)
        requires("dynamictrees")
        requires("regions-unexplored")
        optional("dynamictreesplus")
    }
    modrinth {
        projectId = "IOcN8dvy"
        accessToken = project.findProperty("modrinthToken") ?: System.getenv("MODRINTH_TOKEN")
        minecraftVersions.add(minecraft_version)
        requires("vdjF5PL5") //dt
        requires("Tkikq67H") //ru
        optional("qaO9Dqpu") //dt+
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
